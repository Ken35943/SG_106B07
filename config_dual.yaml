# =============================================================================
# ESP32-S3 Multi-Static Dual-Receiver Fall Detection System — Configuration
# =============================================================================

dual:
  enabled: true
  ports: ["COM3", "COM5"]            # [Rx1 (6 dBi), Rx2 (6 dBi)]
  baud_rate: 921600
  sync:
    mode: id_aligned                 # Sync by Tx-generated sequence ID
    max_lag_ids: 40                  # ~0.8 s worst-case fusion latency at 50 Hz
    interp_max_gap: 20               # Interpolate <=20-id gaps (~0.4 s at 50 Hz)
  paths:
    data_raw: "data/raw_dual"
    data_processed: "data/processed_dual"
    pipeline_states:
      - "data/processed_dual/pipeline_state_rx1.pkl"
      - "data/processed_dual/pipeline_state_rx2.pkl"
  model:
    fusion: spatial_multihead        # spatial_multihead | early
    input_features: 20               # per-link PCA components
  realtime:
    fallback_link: "A"               # auto single-link fallback if Link B dies
    stride: 12                       # grid samples between inferences (~240 ms at 50 Hz)
    fall_threshold: 0.80
    consecutive_windows: 2
    cooldown_seconds: 5.0

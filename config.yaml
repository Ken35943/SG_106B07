# =============================================================================
# ESP32-S3 CSI Fall Detection System — Configuration
# =============================================================================
# This file centralises every tuneable parameter for the data-collection,
# preprocessing, training, and inference pipelines.
# =============================================================================

# ── Hardware ─────────────────────────────────────────────────────────────────
hardware:
  sender:
    port: "COM5"                  # ESP32-S3 with 6 dBi external antenna
    description: "CSI sender (6 dBi external antenna)"
  receiver:
    port: "COM3"                  # ESP32-S3 with 6 dBi external antenna
    description: "CSI receiver (6 dBi external antenna)"
  baud_rate: 921600

# ── WiFi ─────────────────────────────────────────────────────────────────────
wifi:
  ssid: "CSI_SENDER"
  password: "csi12345678"
  channel: 6

# ── CSI Parameters ───────────────────────────────────────────────────────────
csi:
  sample_rate: 100                # Target packets / second
  sample_duration: 10             # Seconds per recording
  num_subcarriers: 190            # Number of OFDM subcarriers in HT40 mode (~190 usable)
  bandwidth: 40                   # MHz (ESP32-S3 HT40 mode)

# ── Directory Paths ──────────────────────────────────────────────────────────
paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  model_saved: "model/saved"
  logs: "logs"

# Alias for backward-compatibility with train.py
data:
  processed_dir: "data/processed"

# ── Preprocessing ────────────────────────────────────────────────────────────
preprocessing:
  # Timing: interpolate irregular packet arrivals onto the nominal csi.sample_rate
  # grid so every window has the same physical duration (measured raw rate on
  # the current firmware is only 60-65 Hz with 10-77 ms jitter).
  resample_to_uniform: true
  min_rate_ratio: 0.5             # Skip recordings whose measured rate < 50% of nominal

  # Log-amplitude (20*log10) turns AGC/distance gain differences between
  # sessions into an additive offset that the band-pass removes.
  log_amplitude: true

  # Hampel outlier filter (vectorised)
  hampel_window: 5
  hampel_threshold: 3.0

  # Causal Butterworth band-pass (identical in training and real-time).
  # Low edge removes the static multipath/DC; high edge is an anti-alias guard.
  # Fall Doppler on a 2.4 GHz bistatic link: f_D = (v/λ)(cosθt+cosθr) ≤ 2v/λ
  # ≈ 16 Hz per m/s → torso at 2-3 m/s lands at 30-49 Hz.  A 10 Hz low-pass
  # (previous setting) removed the entire fall transient.
  bandpass_low_hz: 0.5
  bandpass_high_hz: 40            # clamped to 0.45*fs automatically if fs is lower
  bandpass_order: 4               # per edge (8th-order overall, 4 biquads)

  # PCA dimensionality reduction
  pca_components: 20

  # Sliding-window segmentation.  NOTE: overlapping windows from one recording
  # share content — the train/val/test split MUST be done per recording
  # (groups.npy / GroupShuffleSplit), never per window.
  window_size: 100                # Samples per window
  window_overlap: 0.5             # Fractional overlap [0, 1)

  # Normalisation method: "zscore" | "minmax"
  normalization: "zscore"

# ── Model Hyperparameters ────────────────────────────────────────────────────
model:
  # CNN feature extractor
  cnn_filters: [64, 128]
  kernel_size: 3

  # LSTM temporal encoder
  lstm_hidden: 128
  lstm_layers: 2
  lstm_dropout: 0.3

  # Multi-head self-attention
  attention_heads: 4

  # Fully-connected classifier
  fc_hidden: 64
  num_classes: 2                  # Binary: fall vs. non-fall

# ── Training Hyperparameters ─────────────────────────────────────────────────
training:
  learning_rate: 0.001
  batch_size: 32
  epochs: 100
  early_stopping_patience: 15
  weight_decay: 0.0001
  scheduler_patience: 7
  scheduler_factor: 0.5
  num_workers: 0

# ── Real-Time Fall Detection Runtime ─────────────────────────────────────────
realtime:
  stride: 25                      # Stride in packets between inferences (25 pkts = 250ms at 100Hz)
  fall_threshold: 0.80            # Probability threshold to classify a window as fall
  consecutive_windows: 2          # Consecutive positive windows required to confirm alarm
  cooldown_seconds: 5.0           # Cooldown seconds after alert before re-triggering
  beep_enabled: true              # Audio beep alert on Windows

# ── Activity Labels ──────────────────────────────────────────────────────────
# Binary classification: 0 = fall, 1 = daily activity
activity_labels:
  fall:
    label: 0
    activities:
      - fall_forward
      - fall_backward
      - fall_sideways
  daily:
    label: 1
    activities:
      - walking
      - sitting_down
      - standing_up
      - lying_down
      - empty_room
